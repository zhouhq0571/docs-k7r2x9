function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function unlock(){
 var pw=document.getElementById('pw').value;if(!pw)return;
 var btn=document.querySelector('button[onclick="unlock()"]');btn.disabled=true;btn.textContent='正在本地解密，请稍候…';document.getElementById('err').style.display='none';
 try{
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  btn.textContent='正在整理阅读页面…';
  var ct=b64(P.data),tag=b64(P.tag),full=new Uint8Array(ct.length+tag.length);full.set(ct);full.set(tag,ct.length);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,full);
  var htmlStr=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(htmlStr);document.close();
 }catch(e){document.getElementById('err').style.display='block';btn.disabled=false;btn.textContent='打开文档'}
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});
