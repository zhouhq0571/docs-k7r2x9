async function unlock(){

 var btn=document.querySelector('button[onclick="unlock()"]');btn.disabled=true;btn.textContent='正在本地解密，请稍候…';document.getElementById('err').style.display='none';

 }catch(e){document.getElementById('err').style.display='block';btn.disabled=false;btn.textContent='打开文档'}
